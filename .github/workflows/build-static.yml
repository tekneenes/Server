name: Build & Deploy Static Site

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Statik Paketleme & Doğrulama
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ES Modül söz dizimi kontrolü
        run: |
          node --experimental-vm-modules -e "
          import fs from 'node:fs';
          import vm from 'node:vm';
          const files = [
            ...fs.readdirSync('src/js').filter(f => f.endsWith('.js')).map(f => 'src/js/' + f),
            'src/three/carsPack.js',
          ];
          for (const file of files) {
            new vm.SourceTextModule(fs.readFileSync(file, 'utf8'), { identifier: file });
          }
          console.log('ESM_OK', files.length);
          "

      - name: Statik GitHub Pages klasörünü hazırla
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          cp -r vendor _site/
          touch _site/.nojekyll

      - name: GitHub Pages yapılandır
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/configure-pages@v5

      - name: GitHub Pages paketini yükle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: GitHub Pages Yayını
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages üzerine yayınla
        id: deployment
        uses: actions/deploy-pages@v4
